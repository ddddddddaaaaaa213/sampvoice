# Control service address (from which the control server is accessible to the voice server)
#   (by default localhost:2020 i.e. the voice server will
#    connect to the same machine it is running on port 2020)
# control_host = localhost
# control_port = 2020

# Command service address (to which the command service will be bound)
#   (works on the localhost network interface by default,
#    and the operating system chooses the port (dynamic port))
# command_host = localhost
# command_port = 0

# Voice service address (to which the voice service will be bound)
#   (by default 0.0.0.0:2020, i.e. voice service will work on port 2020 (UDP)
#    accepting packets from any network interface)
# voice_host = 0.0.0.0
# voice_port = 2020

# Number of threads involved in the transit of voice packets
#   (default is 0, which means use the maximum possible number of
#    threads that can run in parallel at the hardware level)
# workers = 0
#include <a_samp> 
#include <voice> 

#undef MAX_PLAYERS 
#define MAX_PLAYERS 100 

// PRESSED(keys) 
#define PRESSED(%0) \ 
    (((newkeys & (%0)) == (%0)) && ((oldkeys & (%0)) != (%0))) 

// RELEASED(keys) 
#define RELEASED(%0) \ 
    (((newkeys & (%0)) != (%0)) && ((oldkeys & (%0)) == (%0))) 

     
public OnPlayerKeyStateChange(playerid, newkeys, oldkeys) 
{ 
    // Pressed Y 
    if(PRESSED(KEY_YES)) StartVoice(playerid); 
    // Released Y 
    if(RELEASED(KEY_YES)) StopVoice(playerid); 
    // 
    return 1; 
} 

public OnPlayerVoice(playerid, BitStream:bs) 
{ 
    // Add Text 
    SetPlayerChatBubble(playerid, "Speaker", COLOR_WHITE, 10.00, 1000); 

    // Get Player Voice Pos 
    new Float:pos[3]; 
    GetPlayerPos(playerid, pos[0], pos[1], pos[2]); 
     
    // Foreach Players 
    for(new i = 0; i < MAX_PLAYERS; i++) 
    { 
        if(playerid == i) continue; 
        if(!IsPlayerConnected(i)) continue; 
         
        // Set param 10.00 distance 
        if(IsPlayerInRangeOfPoint(i, 10.00, pos[0], pos[1], pos[2])) { 
            SendVoice(i, bs); 
        } 
    } 
     
    return 1; 
}  
